{% extends 'dashboard.html' %}
{% load static %}

{% block extra_css %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<style>
    .page-content { padding: 26px 32px; background: #f8fafc; }
    
    /* Core Cards */
    .hms-card {
        background: #ffffff;
        border-radius: 14px;
        border: 1px solid #eef2f6;
        box-shadow: 0 4px 18px rgba(15, 23, 42, 0.035);
        padding: 24px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .hms-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 16px;
        border-bottom: 1px solid #f1f5f9;
        margin-bottom: 20px;
    }
    
    /* Breadcrumb */
    .hms-breadcrumb {
        font-size: 13px;
        color: #64748b;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .hms-breadcrumb a { color: #64748b; text-decoration: none; display: flex; align-items: center; gap: 4px; }
    .hms-breadcrumb a:hover { color: #1e3a8a; }
    .hms-breadcrumb .active { color: #1e3a8a; font-weight: 600; display: flex; align-items: center; gap: 4px; }

    /* Report Navigation Tabs */
    .report-nav-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        border-radius: 10px;
        font-size: 13.5px;
        font-weight: 500;
        color: #475569;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        text-decoration: none;
        transition: all 0.15s ease;
    }
    .report-nav-pill:hover {
        background: #f1f5f9;
        color: #1e293b;
    }
    .report-nav-pill.active {
        background: #1e3a8a;
        color: #ffffff !important;
        border-color: #1e3a8a;
        font-weight: 600;
        box-shadow: 0 4px 12px rgba(30, 58, 138, 0.2);
    }

    /* KPI Analytics Cards */
    .report-kpi-card {
        background: #ffffff;
        border-radius: 14px;
        border: 1px solid #eef2f6;
        padding: 20px 22px;
        display: flex;
        align-items: center;
        gap: 16px;
        box-shadow: 0 4px 18px rgba(15, 23, 42, 0.035);
        transition: transform 0.15s ease;
    }
    .report-kpi-card:hover {
        transform: translateY(-2px);
    }
    .report-kpi-icon {
        width: 50px;
        height: 50px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }
    .report-kpi-val {
        font-size: 24px;
        font-weight: 700;
        color: #0f172a;
        line-height: 1.1;
    }
    .report-kpi-label {
        font-size: 13px;
        color: #64748b;
        font-weight: 500;
        margin-bottom: 3px;
    }

    /* Tables */
    .table-custom {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
    }
    .table-custom th {
        background: #f8fafc;
        color: #475569;
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 12px 16px;
        border-bottom: 2px solid #e2e8f0;
    }
    .table-custom td {
        padding: 14px 16px;
        border-bottom: 1px solid #f1f5f9;
        font-size: 13.5px;
        color: #1e293b;
        vertical-align: middle;
    }
    .table-custom tr:hover td {
        background-color: #fbfcfe;
    }

    /* Status Badges */
    .badge-status {
        padding: 5px 12px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 5px;
    }
    .badge-paid { background: #dcfce7; color: #15803d; }
    .badge-unpaid { background: #fee2e2; color: #b91c1c; }
    .badge-partial { background: #fef3c7; color: #b45309; }

    /* Date Filter Form */
    .date-filter-bar {
        background: #ffffff;
        border-radius: 12px;
        border: 1px solid #eef2f6;
        padding: 12px 18px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    /* Official Printable Sheet Header (Shown only on Print) */
    .print-official-header {
        display: none;
    }

    /* Print Styling */
    @media print {
        body {
            background: #ffffff !important;
            margin: 0 !important;
            padding: 0 !important;
            color: #000000 !important;
        }
        .sidebar, .topbar, .hms-breadcrumb, .report-nav-pill, .date-filter-bar, .no-print, header, .btn {
            display: none !important;
        }
        .main-content, .page-content {
            margin: 0 !important;
            padding: 10px !important;
            background: #ffffff !important;
        }
        .hms-card {
            box-shadow: none !important;
            border: 1px solid #cbd5e1 !important;
            margin-bottom: 16px !important;
            page-break-inside: avoid;
        }
        .print-official-header {
            display: block !important;
            border-bottom: 2px solid #1e3a8a;
            padding-bottom: 14px;
            margin-bottom: 20px;
        }
    }
</style>
{% block report_css %}{% endblock %}
{% endblock %}

{% block content %}
    {% block report_content %}{% endblock %}
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% block report_js %}{% endblock %}
{% endblock %}
