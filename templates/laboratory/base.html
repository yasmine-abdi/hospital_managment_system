{% extends 'dashboard.html' %}
{% load static %}

{% block extra_css %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<style>
    .page-content { padding: 26px 32px; background: #f8fafc; }
    
    /* HMS Core Cards */
    .hms-card {
        background: #ffffff;
        border-radius: 14px;
        border: 1px solid #eef2f6;
        box-shadow: 0 4px 18px rgba(15, 23, 42, 0.035);
        padding: 24px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .hms-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 16px;
        border-bottom: 1px solid #f1f5f9;
        margin-bottom: 20px;
    }
    
    /* Breadcrumb */
    .hms-breadcrumb {
        font-size: 13px;
        color: #64748b;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .hms-breadcrumb a { color: #64748b; text-decoration: none; display: flex; align-items: center; gap: 4px; }
    .hms-breadcrumb a:hover { color: #1e3a8a; }
    .hms-breadcrumb .active { color: #1e3a8a; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    
    /* KPI Stats Card */
    .lab-kpi-card {
        background: #ffffff;
        border-radius: 14px;
        border: 1px solid #eef2f6;
        padding: 20px 22px;
        display: flex;
        align-items: center;
        gap: 18px;
        box-shadow: 0 4px 18px rgba(15, 23, 42, 0.035);
        position: relative;
        overflow: hidden;
    }
    .lab-kpi-icon {
        width: 52px;
        height: 52px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }
    .lab-kpi-val {
        font-size: 26px;
        font-weight: 700;
        color: #0f172a;
        line-height: 1.1;
    }
    .lab-kpi-label {
        font-size: 13px;
        color: #64748b;
        font-weight: 500;
        margin-bottom: 3px;
    }

    /* Status Badges */
    .badge-status {
        padding: 5px 12px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 5px;
    }
    .badge-pending { background: #fef3c7; color: #b45309; }
    .badge-collected { background: #e0f2fe; color: #0369a1; }
    .badge-progress { background: #f3e8ff; color: #7e22ce; }
    .badge-completed { background: #dcfce7; color: #15803d; }
    .badge-cancelled { background: #fee2e2; color: #b91c1c; }

    /* Priority Badges */
    .badge-routine { background: #f1f5f9; color: #475569; }
    .badge-urgent { background: #ffedd5; color: #c2410c; font-weight: 600; }
    .badge-stat { background: #ffe4e6; color: #e11d48; font-weight: 700; animation: pulse 2s infinite; }
    
    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.75; }
    }

    /* Result Value Flags */
    .flag-normal { color: #15803d; background: #dcfce7; padding: 2px 8px; border-radius: 6px; font-weight: 600; font-size: 11px; }
    .flag-high { color: #b91c1c; background: #fee2e2; padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 11px; }
    .flag-low { color: #c2410c; background: #ffedd5; padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 11px; }
    .flag-positive { color: #b91c1c; background: #fee2e2; padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 11px; }
    .flag-negative { color: #15803d; background: #dcfce7; padding: 2px 8px; border-radius: 6px; font-weight: 600; font-size: 11px; }
    .flag-abnormal { color: #7e22ce; background: #f3e8ff; padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 11px; }

    /* Tables */
    .table-custom {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
    }
    .table-custom th {
        background: #f8fafc;
        color: #475569;
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 12px 16px;
        border-bottom: 2px solid #e2e8f0;
    }
    .table-custom td {
        padding: 14px 16px;
        border-bottom: 1px solid #f1f5f9;
        font-size: 13.5px;
        color: #1e293b;
        vertical-align: middle;
    }
    .table-custom tr:hover td {
        background-color: #fbfcfe;
    }

    /* Search & Filter Nav */
    .filter-tab-btn {
        padding: 7px 16px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        color: #64748b;
        background: transparent;
        border: 1px solid transparent;
        text-decoration: none;
        transition: all 0.15s ease;
    }
    .filter-tab-btn:hover {
        background: #f1f5f9;
        color: #1e293b;
    }
    .filter-tab-btn.active {
        background: #1e3a8a;
        color: #ffffff !important;
        font-weight: 600;
    }

    .form-control:focus, .form-select:focus {
        box-shadow: 0 0 0 0.25rem rgba(30, 58, 138, 0.15);
        border-color: #2563eb;
    }
    a { text-decoration: none; }
</style>
{% block lab_css %}{% endblock %}
{% endblock %}

{% block content %}
    {% block lab_content %}
    {% endblock %}
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block lab_js %}{% endblock %}
{% endblock %}
