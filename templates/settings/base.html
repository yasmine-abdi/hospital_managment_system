{% extends 'dashboard.html' %}
{% load static %}

{% block extra_css %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<style>
    .page-content { padding: 26px 32px; background: #f8fafc; }
    
    /* Core Cards */
    .hms-card {
        background: #ffffff;
        border-radius: 14px;
        border: 1px solid #eef2f6;
        box-shadow: 0 4px 18px rgba(15, 23, 42, 0.035);
        padding: 24px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .hms-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 16px;
        border-bottom: 1px solid #f1f5f9;
        margin-bottom: 20px;
    }
    
    /* Breadcrumb */
    .hms-breadcrumb {
        font-size: 13px;
        color: #64748b;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .hms-breadcrumb a { color: #64748b; text-decoration: none; display: flex; align-items: center; gap: 4px; }
    .hms-breadcrumb a:hover { color: #1e3a8a; }
    .hms-breadcrumb .active { color: #1e3a8a; font-weight: 600; display: flex; align-items: center; gap: 4px; }

    /* Settings Navigation Pills */
    .settings-nav-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 18px;
        border-radius: 10px;
        font-size: 13.5px;
        font-weight: 500;
        color: #475569;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        text-decoration: none;
        transition: all 0.15s ease;
    }
    .settings-nav-pill:hover {
        background: #f1f5f9;
        color: #1e293b;
    }
    .settings-nav-pill.active {
        background: #1e3a8a;
        color: #ffffff !important;
        border-color: #1e3a8a;
        font-weight: 600;
        box-shadow: 0 4px 12px rgba(30, 58, 138, 0.2);
    }

    /* Tables */
    .table-custom {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
    }
    .table-custom th {
        background: #f8fafc;
        color: #475569;
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 12px 16px;
        border-bottom: 2px solid #e2e8f0;
    }
    .table-custom td {
        padding: 14px 16px;
        border-bottom: 1px solid #f1f5f9;
        font-size: 13.5px;
        color: #1e293b;
        vertical-align: middle;
    }
    .table-custom tr:hover td {
        background-color: #fbfcfe;
    }

    .form-control:focus, .form-select:focus {
        box-shadow: 0 0 0 0.25rem rgba(30, 58, 138, 0.15);
        border-color: #2563eb;
    }
    a { text-decoration: none; }
</style>
{% block settings_css %}{% endblock %}
{% endblock %}

{% block content %}
    {% block settings_content %}{% endblock %}
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block settings_js %}{% endblock %}
{% endblock %}
